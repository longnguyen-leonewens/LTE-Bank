<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTE Quiz Bank</title>
<meta name="description" content="Self-contained LTE L2/PHY quiz bank built from the Learning2 notebook: timed tests, confidence points, explanations and sources.">
<style>
:root{
  --bg:#f3f2ec; --panel:#ffffff; --panel-2:#faf9f5; --ink:#18212b; --muted:#5b6571; --line:#dedbd1; --line-2:#ebe8df;
  --accent:#0a6e68; --accent-ink:#ffffff; --accent-soft:#dcefec; --accent-line:#8cc7c0;
  --warn:#a85d06; --warn-soft:#fbefd9; --ok:#17803d; --ok-soft:#e1f3e7; --bad:#b42318; --bad-soft:#fbe6e3;
  --chip:#ecebe4; --shadow:0 1px 2px rgba(20,25,30,.05),0 6px 20px -12px rgba(20,25,30,.18);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1217; --panel:#141b22; --panel-2:#11171d; --ink:#e5e9ed; --muted:#97a2ad; --line:#26313b; --line-2:#1e2730;
    --accent:#3cc2b6; --accent-ink:#04201d; --accent-soft:#12302e; --accent-line:#24635d;
    --warn:#f0a447; --warn-soft:#33240f; --ok:#4fd27e; --ok-soft:#10291a; --bad:#ff7b72; --bad-soft:#341616;
    --chip:#1c252e; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1217; --panel:#141b22; --panel-2:#11171d; --ink:#e5e9ed; --muted:#97a2ad; --line:#26313b; --line-2:#1e2730;
  --accent:#3cc2b6; --accent-ink:#04201d; --accent-soft:#12302e; --accent-line:#24635d;
  --warn:#f0a447; --warn-soft:#33240f; --ok:#4fd27e; --ok-soft:#10291a; --bad:#ff7b72; --bad-soft:#341616;
  --chip:#1c252e; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);min-height:100vh}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--chip);padding:1px 5px;border-radius:5px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(24px,3.2vw,32px);letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:15.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dim{color:var(--muted);font-weight:400}
.small{font-size:12.5px}
.spacer{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.pos{color:var(--ok)} .neg{color:var(--bad)} .warnc{color:var(--warn)}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:22px;height:22px;flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600}
.tabs button:hover{background:var(--chip);color:var(--ink)}
.tabs button[aria-current="true"]{color:var(--ink);background:var(--chip)}
.themebtn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.themebtn:hover{color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:22px 16px 60px}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.eyebrow{font:600 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}
.hint{color:var(--muted);font-size:13px;margin:.5em 0 0}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:9px;font-weight:600;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--accent-line);background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--accent)}
.btn.ghost{background:transparent}
.btn.big{padding:12px 22px;font-size:16px}
.btn.wide{width:100%}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.link:disabled{color:var(--muted);text-decoration:none}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--panel-2)}
.seg button{border:0;background:none;padding:7px 13px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"] .dim{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.type{background:var(--accent-soft);color:var(--accent)}
.chip.type.multi{background:var(--warn-soft);color:var(--warn)}
.chip.flagchip{background:var(--warn-soft);color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tfoot td{font-weight:700;border-bottom:0}
.bank-tbl td:not(:first-child),.bank-tbl th:not(:first-child){text-align:right;font-family:var(--mono)}
.bar{display:block;height:8px;background:var(--chip);border-radius:5px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar>i.low{background:var(--warn)}
.err{color:var(--bad);font-weight:600;min-height:1.2em;margin:.6em 0 0}

/* setup */
.hero{display:flex;gap:28px;align-items:center;justify-content:space-between;margin-bottom:18px;background:linear-gradient(135deg,var(--panel),var(--panel-2))}
.hero-text{max-width:680px}
.hero p{margin:0;color:var(--muted)}
.art{margin:0;flex:none;text-align:center}
.art svg{width:176px;height:auto;display:block}
.art figcaption{font:11.5px var(--mono);color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center;justify-content:center}
.ga-data{fill:var(--chip)} .ga-dmrs{fill:var(--accent)} .ga-srs{fill:var(--warn)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}
.lg.ga-dmrs{background:var(--accent)} .lg.ga-srs{background:var(--warn);margin-left:6px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;border-color:var(--accent-line);background:var(--accent-soft)}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.side-col{display:grid;gap:18px}
.field{padding:14px 0;border-top:1px solid var(--line-2)}
.field:first-of-type{border-top:0;padding-top:4px}
.flabel{font-weight:700;font-size:13px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.muted-field{opacity:.6}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.counts label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input[type=number],input[type=text],input[type=search],select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;width:100%}
#minutes{width:90px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.topic-chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.tchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.tchip .dim{font-family:var(--mono);font-size:11.5px}
.start-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-top:14px;border-top:1px solid var(--line-2)}
.cbm-tbl td:nth-child(2),.cbm-tbl td:nth-child(3){font-family:var(--mono);font-weight:700}

/* test */
.test{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.test-main{padding:24px 26px;min-height:420px}
.test-side{position:sticky;top:76px}
.side-card{padding:16px;display:grid;gap:14px}
.timer-wrap{display:flex;align-items:baseline;gap:10px}
.timer{font:700 30px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--warn)} .timer.crit{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.timer.crit{animation:none}}
.progress{display:grid;gap:5px;font-size:12.5px}
.nav-sec{margin-bottom:8px}
.nav-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.nav-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.nav-cell{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;font:600 11px var(--mono);color:var(--muted);padding:0}
.nav-cell:hover{border-color:var(--accent-line);color:var(--ink)}
.nav-cell.ans{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.nav-cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav-cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav-cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.nav-cell.flag::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent var(--warn) transparent transparent;border-top-right-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend .lg{width:10px;height:10px;border-radius:3px;margin-right:4px;border:1px solid var(--line)}
.legend .lg.ans{background:var(--accent-soft);border-color:var(--accent-line)}
.legend .lg.flag{background:var(--warn)}
.legend .lg.ok{background:var(--ok-soft);border-color:var(--ok)}
.legend .lg.bad{background:var(--bad-soft);border-color:var(--bad)}
.codebox{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.codebox code{font-size:12px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qno{font:800 22px/1 var(--mono);color:var(--accent);margin-right:4px}
.secline{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:16px}
.flagbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.flagbtn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.qtext{font-size:17px;line-height:1.6;margin-bottom:18px}
.qtext.fib{line-height:2.3}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);transition:border-color .1s,background .1s}
.opt:hover:not(:disabled){border-color:var(--accent-line);background:var(--panel-2)}
.opt:disabled{cursor:default;opacity:1}
.opt .key{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--muted);color:var(--muted);font:700 12px var(--mono);border-radius:50%;margin-top:-1px}
.opts.multi .opt .key{border-radius:6px}
.opt .otext{flex:1;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{border-color:var(--ok);color:var(--ok)}
.opt.correct.sel .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .mark{font-weight:800;margin-left:6px}
.opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
input.blank{font:600 16px var(--mono);border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px 6px 0 0;margin:0 3px;width:auto;text-align:center;color:var(--ink)}
input.blank:focus{outline:none;background:color-mix(in srgb,var(--accent-soft) 60%,var(--panel));box-shadow:0 2px 0 0 var(--accent)}
input.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
input.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.parts{display:grid;gap:10px;margin-bottom:6px}
.part{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,260px);gap:12px;align-items:center}
.part .pl{font-weight:600;font-size:14px}
.pin{display:flex;align-items:center;gap:8px}
.pin input{font:600 15px var(--mono);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;background:var(--panel)}
.pin input:focus{border-color:var(--accent);outline:none}
.part.ok .pin input{border-color:var(--ok);background:var(--ok-soft)}
.part.bad .pin input{border-color:var(--bad);background:var(--bad-soft)}
.unit{font-size:13px;color:var(--muted);white-space:nowrap}
.conf-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.conf-q{font-weight:700;font-size:13.5px}
.conf{display:grid;grid-template-columns:repeat(3,minmax(92px,1fr));gap:6px}
.conf button{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;display:grid;line-height:1.25;text-align:center}
.conf button b{font-size:13.5px}
.conf button span{font:11.5px var(--mono);color:var(--muted)}
.conf button.on{border-color:var(--accent);background:var(--accent-soft)}
.conf button.on span{color:var(--accent)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px}
.kbd-hint{font-size:11.5px;margin-top:12px}
.mtimer{display:none;font:700 14px var(--mono);padding:4px 10px;border-radius:8px;background:var(--chip);font-variant-numeric:tabular-nums}
.mtimer.warn{color:var(--warn)} .mtimer.crit{color:var(--bad)}
.fb>.link{justify-self:start;text-align:left}
.fb{margin-top:18px;border-radius:10px;padding:14px 16px;border:1px solid;display:grid;gap:8px}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fb.ok .fb-head b{color:var(--ok)} .fb.bad .fb-head b{color:var(--bad)}
.pts{font:700 13px var(--mono)}
.fb-ans{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:14px;margin:6px 0}
.ans-pill{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.ans-pill .alt,.alt{color:var(--muted);font-size:12px}
.tol{color:var(--muted);font-size:12px}
.fb-x{font-size:14.5px;line-height:1.6}
.maplist{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.src-label{font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:10.5px;margin-right:2px}
.srcitem{border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--muted)}
.srcitem.notes{background:var(--accent-soft);color:var(--accent)}
.srcitem.spec{font-family:var(--mono);font-size:11.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal-box{max-width:440px;width:100%}
.modal-box p{margin:.2em 0 1.2em}

/* results */
.res-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.res-head h1{margin:0}
.kpis{display:flex;gap:12px;flex-wrap:wrap}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px;background:var(--panel-2)}
.kv{font:800 24px/1.1 var(--mono)}
.kv small{font-size:14px;color:var(--muted);font-weight:600}
.kl{font-size:12px;color:var(--muted);margin-top:3px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:18px;align-items:start}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 46px;gap:10px;align-items:center;font-size:13.5px;padding:4px 0}
.brow .num{font-family:var(--mono);text-align:right;font-size:12.5px}
.review-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.review-bar h2{margin:0}
.rev{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:12px;background:var(--panel)}
.rev.ok{border-left-color:var(--ok)} .rev.bad{border-left-color:var(--bad)}
.rev header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rev .qno{font-size:16px}
.rev .qtext{font-size:15.5px;margin-bottom:12px}
.rev .qtext.fib{line-height:1.9}
.rev .opt{padding:8px 12px}
.rev .opts{margin-bottom:10px}
.verdict{font-weight:700;font-size:13px}
.rev.ok .verdict{color:var(--ok)} .rev.bad .verdict{color:var(--bad)}
.ufill{font:600 14.5px var(--mono);padding:1px 7px;border-radius:5px;border-bottom:2px solid}
.ufill.ok{background:var(--ok-soft);border-color:var(--ok)}
.ufill.bad{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.cfill{font:600 14.5px var(--mono);padding:1px 7px;border-radius:5px;margin-left:4px;background:var(--ok-soft);border-bottom:2px solid var(--ok)}
.parts-tbl{max-width:640px;margin-bottom:12px}
.parts-tbl td:nth-child(2),.parts-tbl td:nth-child(3){font-family:var(--mono)}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.bank-item .qtext{font-size:15px}
.idc{font-size:11px;color:var(--muted);background:none}
.bank-bar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;position:sticky;top:64px;z-index:5}
.hist-tbl td{vertical-align:middle}
.hbar{width:22%}

@media (max-width: 980px){
  .cols{grid-template-columns:1fr}
  .test{grid-template-columns:1fr}
  .test-side{position:static}
  .mtimer{display:inline-flex}
  .nav-grid{grid-template-columns:repeat(auto-fill,minmax(30px,1fr))}

<script>
/* ===== Bank core: topics, sources, builders ===== */
const BANK = [];
const Q = o => { BANK.push(o); return o; };

const TOPICS = {
  arch:  'Architecture & channels',
  l2:    'PDCP & RLC',
  mac:   'MAC',
  harq:  'ARQ & HARQ',
  grid:  'Frame, FDD/TDD & resource grid',
  cell:  'Cell search & system info',
  ra:    'Random access & timing advance',
  sched: 'Grants, SR/BSR, scheduler & DRX',
  dl:    'DL physical channels',
  ul:    'UL physical layer',
  spec:  '3GPP specs & releases',
  git:   'Git & Gerrit'
};

/* Notes sections (text-extracted part of Learning2) */
const NOTE_SEC = {
  1:'Abbreviations & vocabulary', 2:'Channel hierarchy', 3:'L2 stack & user-plane path', 4:'PDCP',
  5:'MAC fundamentals', 6:'MAC subheaders & LCID', 7:'MAC multiplexing', 8:'PHY responsibilities',
  9:'RLC', 10:'ARQ concepts', 11:'HARQ', 12:'Multiple HARQ processes', 13:'FDD HARQ timing',
  14:'What bypasses HARQ', 15:'FDD & TDD', 16:'SC-FDMA', 17:'LTE cell initialization',
  18:'PCI, PSS/SSS & CRS', 19:'Reading 3GPP specifications', 20:'Uplink flow & PHICH',
  21:'Spec vs receiver implementation', 22:'Transform precoding chain', 23:'UL subframe, DMRS & SRS',
  24:'UL-SCH coding chain', 25:'PRACH timing budget', 26:'PRACH preamble construction'
};
/* Notes page modules (image-only pages; facts sourced from the cited spec) */
const NOTE_PG = {
  29:['29–35','Uplink Flow'], 36:['36–41','Downlink Flow'], 42:['42','Big Picture'], 43:['43','Grants'],
  44:['44–47','BSR'], 48:['48–50','Scheduling Request'], 51:['51–68','Scheduler'], 69:['69–72','Resource Grid'],
  73:['73–74','Timing Advance'], 75:['75–78','DRX'], 79:['79','Random Access'], 80:['80–82','PDSCH'],
  83:['83–84','PDCCH'], 85:['85','PCFICH'], 86:['86','PHICH'], 87:['87','PBCH'], 88:['88–89','PUSCH'],
  90:['90','UL-SCH'], 91:['91–92','PRACH'], 93:['93','PUCCH'], 94:['94–95','Signals'],
  96:['96–108','Git/Gerrit'], 109:['109','UCI'], 110:['110','PUSCH'], 111:['111','DMRS'], 112:['112','SRS'],
  113:['113','Release Boundaries']
};
function renderSource(s) {
  if (!s) return [];
  return s.split('·').map(t => t.trim()).filter(Boolean).map(t => {
    let m;
    if ((m = t.match(/^n(\d+)$/))) return { kind: 'notes', text: 'Learning2 notes — ' + NOTE_SEC[m[1]] };
    if ((m = t.match(/^p(\d+)$/))) { const p = NOTE_PG[m[1]]; return { kind: 'notes', text: 'Learning2 notes p.' + p[0] + ' — ' + p[1] }; }
    if (/^\d{2}\.\d{3}/.test(t)) return { kind: 'spec', text: '3GPP TS ' + t };
    return { kind: 'ref', text: t };
  });
}

/* Handy notation */
const N1 = 'N<sub>ID</sub><sup>(1)</sup>';
const N2 = 'N<sub>ID</sub><sup>(2)</sup>';
const NCS = 'N<sub>CS</sub>';

/* --- Builders --- */
// Mapping question: forward (key → value) and optionally backward (value → key).
function mapQ(o) {
  return Q({
    id: o.id, t: 'mcq', tp: o.tp, s: o.s, nw: o.nw,
    gen: r => {
      const pairs = o.pairs;
      const [k, v] = r.pick(pairs);
      const useBack = o.back && r.int(0, 1) === 1;
      let q, a, w;
      if (useBack) {
        q = o.back(v, k); a = k;
        w = pairs.filter(p => p[1] !== v).map(p => p[0]);
      } else {
        q = o.fwd(k, v); a = v;
        w = [...new Set(pairs.map(p => p[1]))].filter(x => x !== v);
        if (o.extraW) w = w.concat(o.extraW.filter(x => x !== v));
      }
      let x = o.x ? o.x(k, v) : `${k} → ${v}.`;
      if (o.all) x += ' <span class="maplist">' + pairs.map(p => `<b>${p[0]}</b> → ${p[1]}`).join('; ') + '</span>';
      return { q, a, w, x };
    }
  });
}
// Ordered chain: "which step comes immediately after X?" (+ optional "before").
function chainQ(o) {
  return Q({
    id: o.id, t: 'mcq', tp: o.tp, s: o.s,
    gen: r => {
      const c = o.chain;
      const after = r.int(0, 1) === 0;
      let i, q, a;
      if (after) { i = r.int(0, c.length - 2); a = c[i + 1]; q = `${o.label}: which step comes <b>immediately after</b> “${c[i]}”?`; }
      else { i = r.int(1, c.length - 1); a = c[i - 1]; q = `${o.label}: which step comes <b>immediately before</b> “${c[i]}”?`; }
      const w = c.filter(s => s !== a && s !== c[i]);
      return { q, a, w, x: 'Full order: ' + c.map((s, j) => (s === a ? `<b>${s}</b>` : s)).join(' → ') + '.' + (o.note ? ' ' + o.note : '') };
    }
  });
}
// Full-sequence question: correct order vs. orders with swapped neighbours.
function orderQ(o) {
  return Q({
    id: o.id, t: 'mcq', tp: o.tp, s: o.s,
    gen: r => {
      const c = o.chain, a = c.join(' → ');
      const w = new Set();
      let guard = 0;
      while (w.size < 5 && guard++ < 50) {
        const d = c.slice();
        const i = r.int(0, d.length - 2);
        [d[i], d[i + 1]] = [d[i + 1], d[i]];
        if (r.int(0, 2) === 0) { const j = r.int(0, d.length - 2); [d[j], d[j + 1]] = [d[j + 1], d[j]]; }
        const s = d.join(' → ');
        if (s !== a) w.add(s);
      }
      return { q: o.q, a, w: [...w], x: o.x };
    }
  });
}
const fmt = (v, d = 2) => { const p = Math.pow(10, d); return String(Math.round(v * p) / p); };
const binN = (v, n) => v.toString(2).padStart(n, '0');

/* ===== MCQ bank part 1: Architecture, PDCP/RLC, MAC, ARQ/HARQ ===== */

/* ---------- Architecture & channels ---------- */
(() => {
  const ABBR = [
    ['BSR', 'Buffer Status Report', 'MAC CE telling the eNB how much uplink data is waiting'],
    ['LCG', 'Logical Channel Group', 'set of logical channels whose buffer occupancy is reported together'],
    ['TAC', 'Timing Advance Command', 'MAC CE that adjusts the UE’s current timing advance'],
    ['TAG', 'Timing Advance Group', 'set of serving cells that share one timing advance'],
    ['RAR', 'Random Access Response', 'Msg2: gives the initial TA and the UL grant for Msg3'],
    ['DRX', 'Discontinuous Reception', 'lets the UE periodically stop monitoring PDCCH to save power'],
    ['HARQ', 'Hybrid Automatic Repeat reQuest', 'fast MAC/PHY retransmission with soft combining'],
    ['CQI', 'Channel Quality Indicator', 'UE report of DL channel quality used for link adaptation'],
    ['MCS', 'Modulation and Coding Scheme', 'eNB-chosen modulation order and code rate of a transmission'],
    ['UPC', 'User Plane Control', 'scheduler subsystem that makes grant decisions and drives L2 MAC'],
    ['PHR', 'Power Headroom Report', 'MAC CE reporting how much transmit power the UE has left'],
    ['LCID', 'Logical Channel ID', '5-bit MAC subheader field identifying the payload type'],
    ['CE', 'Control Element', 'MAC-level control information carried inside a MAC PDU'],
    ['LTEBB', 'LTE Baseband', 'the baseband processing platform/unit for LTE']
  ];
  Q({ id: 'arch-abbr', t: 'mcq', tp: 'arch', s: 'n1',
    gen: r => {
      const [ab, ex, def] = r.pick(ABBR);
      const others = ABBR.filter(x => x[0] !== ab);
      const mode = r.int(0, 2);
      if (mode === 0) return { q: `What does <b>${ab}</b> stand for?`, a: ex, w: others.map(x => x[1]), x: `${ab} = ${ex}: ${def}.` };
      if (mode === 1) return { q: `Which abbreviation matches this description: “${def}”?`, a: ab, w: others.map(x => x[0]), x: `${ab} (${ex}) — ${def}.` };
      return { q: `What is the role of <b>${ab}</b> (${ex})?`, a: def.charAt(0).toUpperCase() + def.slice(1), w: others.map(x => x[2].charAt(0).toUpperCase() + x[2].slice(1)), x: `${ab} = ${ex}: ${def}.` };
    } });

  Q({ id: 'arch-stack', t: 'mcq', tp: 'arch', s: 'n3 · 36.300 §6',
    q: 'On the transmit side, user-plane data passes down the LTE stack in which order?',
    a: 'PDCP → RLC → MAC → PHY',
    w: ['RLC → PDCP → MAC → PHY', 'PDCP → MAC → RLC → PHY', 'MAC → RLC → PDCP → PHY', 'RLC → MAC → PDCP → PHY'],
    x: 'PDCP (security, header compression) is on top; RLC segments/concatenates to fit the grant; MAC multiplexes into one transport block; PHY codes and modulates it.' });

  Q({ id: 'arch-sdu', t: 'mcq', tp: 'arch', s: 'n3',
    v: [
      { q: 'A PDCP PDU handed down to RLC becomes a(n)…', a: 'RLC SDU', w: ['RLC PDU', 'MAC CE', 'Transport block', 'PDCP SDU'] },
      { q: 'An RLC PDU handed down to MAC becomes a(n)…', a: 'MAC SDU', w: ['MAC CE', 'RLC SDU', 'Transport block', 'PDCP PDU'] },
      { q: 'What does MAC hand to PHY for one transmission?', a: 'A transport block (one MAC PDU)', w: ['One MAC SDU per logical channel', 'An RLC STATUS PDU', 'Modulated symbols', 'A PDCP PDU'] }
    ],
    x: 'Each layer’s PDU is the next layer’s SDU: PDCP PDU → RLC SDU; RLC PDU → MAC SDU; MAC builds one MAC PDU = one transport block, which PHY turns into coded/modulated symbols.' });

  const PROB = [
    ['eavesdropping on the radio link', 'PDCP ciphering'],
    ['large IP/UDP/RTP header overhead', 'PDCP header compression (ROHC)'],
    ['a packet larger than the current grant', 'RLC segmentation'],
    ['a grant size that changes every TTI', 'MAC multiplexing and padding'],
    ['a transport block that fails to decode', 'HARQ retransmission'],
    ['an idle UE that must learn about incoming data', 'Paging (and broadcast system information)']
  ];
  Q({ id: 'arch-problem', t: 'mcq', tp: 'arch', s: 'n3',
    gen: r => {
      const [p, m] = r.pick(PROB);
      return { q: `In the notes’ problem → mechanism map, which mechanism addresses <b>${p}</b>?`, a: m,
        w: PROB.filter(x => x[1] !== m).map(x => x[1]),
        x: `${m} addresses ${p}. Full map: eavesdropping → ciphering; header overhead → ROHC; oversize packet → RLC segmentation; varying grant → MAC mux/padding; decode failure → HARQ; idle UE → paging/broadcast.` };
    } });

  const LOG = ['BCCH', 'PCCH', 'CCCH', 'DCCH', 'DTCH', 'MCCH', 'MTCH'];
  const TRN = ['BCH', 'PCH', 'DL-SCH', 'UL-SCH', 'RACH', 'MCH'];
  const PHY = ['PBCH', 'PDSCH', 'PDCCH', 'PCFICH', 'PHICH', 'PMCH', 'PUSCH', 'PUCCH', 'PRACH'];
  const chX = 'Logical channels (…CCH/…TCH) describe <i>what</i> is carried, between RLC and MAC; transport channels (BCH, PCH, DL-/UL-SCH, RACH, MCH) describe <i>how</i>, between MAC and PHY; physical channels (P…CH) are the actual time-frequency resources.';
  Q({ id: 'arch-chtype', t: 'multi', tp: 'arch', s: 'n2 · 36.300 §5–6', n: 6, kmin: 2, kmax: 4,
    v: [
      { q: 'Which of these are <b>transport</b> channels?', a: TRN, w: LOG.concat(PHY) },
      { q: 'Which of these are <b>logical</b> channels?', a: LOG, w: TRN.concat(PHY) },
      { q: 'Which of these are <b>physical</b> channels?', a: PHY, w: LOG.concat(TRN) }
    ], x: chX });

  const L2T = [
    ['BCCH carrying the MIB', 'BCH'], ['BCCH carrying SIBs', 'DL-SCH'], ['PCCH (paging)', 'PCH'],
    ['DL DTCH (user data)', 'DL-SCH'], ['UL DCCH (RRC signalling)', 'UL-SCH'], ['UL CCCH (e.g., RRC Connection Request)', 'UL-SCH'],
    ['MTCH (multicast traffic)', 'MCH']
  ];
  const T2P = [['BCH', 'PBCH'], ['DL-SCH', 'PDSCH'], ['PCH', 'PDSCH'], ['UL-SCH', 'PUSCH'], ['RACH', 'PRACH'], ['MCH', 'PMCH']];
  Q({ id: 'arch-map', t: 'mcq', tp: 'arch', s: 'n2 · 36.300 §5.3.1, §6.1.3',
    gen: r => {
      if (r.int(0, 1)) {
        const [l, t] = r.pick(L2T);
        return { q: `${l} is mapped to which <b>transport</b> channel?`, a: t, w: TRN.filter(x => x !== t),
          x: `${l} → ${t}. MIB rides BCH/PBCH; SIBs, paging (PCH) and all unicast DL data end up on PDSCH; UL CCCH/DCCH/DTCH use UL-SCH on PUSCH.` };
      }
      const [t, p] = r.pick(T2P);
      return { q: `Transport channel <b>${t}</b> is carried on which physical channel?`, a: p, w: PHY.filter(x => x !== p),
        x: `${t} → ${p}. Mapping: BCH→PBCH, DL-SCH & PCH→PDSCH, MCH→PMCH, UL-SCH→PUSCH, RACH→PRACH.` };
    } });

  Q({ id: 'arch-ctrl', t: 'multi', tp: 'arch', s: 'n2 · 36.211 §5–6', n: 6, kmin: 2, kmax: 4,
    q: 'Which physical channels carry <b>no transport channel</b> (pure L1 control)?',
    a: ['PDCCH', 'PCFICH', 'PHICH', 'PUCCH'], w: ['PDSCH', 'PBCH', 'PUSCH', 'PMCH', 'PRACH'],
    x: 'PDCCH (DCI), PCFICH (CFI), PHICH (HARQ indicator) and PUCCH (UCI) carry L1 control only. PDSCH, PBCH, PMCH, PUSCH and PRACH each carry a transport channel.' });

  Q({ id: 'arch-upc', t: 'mcq', tp: 'arch', s: 'n1 · n3',
    q: 'According to the notes, how does <b>UPC</b> relate to L2?',
    a: 'It makes the grant decisions and drives L2 MAC with grants, outside the user-data path',
    w: ['It ciphers and compresses user-plane packets', 'It performs turbo decoding of the uplink', 'It is the RLC entity that segments SDUs', 'It forwards user data from PDCP to RLC'],
    x: 'The notes: L2 (PDCP/RLC/MAC) is the user plane; UPC is separate, makes scheduling decisions and drives MAC by providing grants.' });

  const SPEC = ['PRACH preamble sequences and formats', 'DMRS sequence construction', 'UL-SCH and UCI channel coding', 'UL power-control formulae', 'HARQ timing and process rules'];
  const IMPL = ['The eNB channel-estimation algorithm', 'The equalizer design (e.g., MMSE vs ZF)', 'The PRACH detector algorithm', 'The scheduler’s choice of which UE to serve'];
  Q({ id: 'arch-specimpl', t: 'multi', tp: 'arch', s: 'n21', n: 5, kmin: 2, kmax: 3,
    v: [
      { q: 'Which of these are <b>defined by 3GPP</b> (normative)?', a: SPEC, w: IMPL },
      { q: 'Which of these are <b>left to the vendor’s implementation</b>?', a: IMPL, w: SPEC }
    ],
    x: 'The spec fixes what is transmitted and how it must be interpreted (sequences, coding, timing, formulae). How a receiver recovers it — channel estimation, equalization, detection — and the scheduling policy are implementation choices, bounded only by performance requirements.' });

  Q({ id: 'arch-cqimcs', t: 'mcq', tp: 'arch', s: 'n1 · 36.213 §7.2.3',
    q: 'Which pairing of CQI and MCS is correct?',
    a: 'The UE reports CQI; the eNB selects the MCS',
    w: ['The eNB reports CQI; the UE selects the MCS', 'The UE reports the MCS; the eNB derives CQI from it', 'Both are UE reports carried in the BSR'],
    x: 'CQI is the UE’s report of DL channel quality; the eNB (link adaptation) uses it, plus HARQ statistics, to choose the MCS it signals in the DCI.' });

  Q({ id: 'arch-phy', t: 'multi', tp: 'arch', s: 'n8 · 36.300 §5', n: 6, kmin: 2, kmax: 4,
    q: 'Which of these are <b>PHY</b> responsibilities in the notes?',
    a: ['FEC encoding/decoding', 'HARQ soft combining', 'Rate matching', 'Modulation/demodulation', 'MIMO processing and beamforming', 'Time/frequency synchronization', 'Radio measurements'],
    w: ['Ciphering', 'Logical channel prioritization', 'RLC ARQ', 'ROHC header compression', 'Building BSR MAC CEs', 'Segmentation of SDUs'],
    x: 'PHY: error detection, FEC, HARQ soft combining, rate matching, mapping to physical channels, power weighting, modulation, sync, measurements, MIMO/diversity/beamforming, RF. Ciphering/ROHC are PDCP, ARQ/segmentation RLC, LCP/BSR MAC.' });

  Q({ id: 'arch-bf', t: 'mcq', tp: 'arch', s: 'n8',
    q: 'In the notes, beamforming means…',
    a: 'Focusing RF energy toward a particular UE instead of spreading it uniformly',
    w: ['Sending the same signal equally to every UE in the cell', 'Splitting a transport block into code blocks', 'Switching between UL and DL on one carrier', 'Repeating a TB in 4 consecutive subframes'],
    x: 'Beamforming weights the antennas so energy is concentrated toward the target UE, raising its SINR.' });
})();

/* ---------- PDCP & RLC ---------- */
(() => {
  Q({ id: 'l2-pdcpfn', t: 'multi', tp: 'l2', s: 'n4 · 36.323 §4.4', n: 6, kmin: 2, kmax: 4,
    q: 'Which of these are <b>PDCP</b> functions?',
    a: ['Ciphering and deciphering', 'Integrity protection and verification', 'ROHC header compression', 'PDCP sequence-number maintenance', 'Reordering and in-order delivery', 'Duplicate discarding', 'Timer-based SDU discard', 'Routing/duplication for split bearers'],
    w: ['Segmentation to fit the grant', 'HARQ retransmission', 'Logical channel prioritization', 'Multiplexing SDUs into a transport block', 'Modulation', 'Building RLC STATUS PDUs'],
    x: 'PDCP: SN maintenance, header compression (ROHC/EHC/UDC), ciphering, integrity, discard, split/DAPS routing, duplication, reordering, duplicate discard. Segmentation and STATUS PDUs are RLC; HARQ, LCP and multiplexing are MAC; modulation is PHY.' });

  Q({ id: 'l2-seg', t: 'mcq', tp: 'l2', s: 'n3 · n9 · 36.322 §5.1',
    q: 'An IP packet is larger than the size MAC can send this TTI. Which layer splits it?',
    a: 'RLC', w: ['PDCP', 'MAC', 'PHY', 'RRC'],
    x: 'RLC (UM/AM) segments and concatenates SDUs to exactly fit the size MAC requests; LTE MAC does not segment.' });

  Q({ id: 'l2-integ', t: 'mcq', tp: 'l2', s: 'n4 · 36.323 §5.7',
    q: 'In LTE (Rel-8), PDCP integrity protection is applied to…',
    a: 'Control-plane data on SRBs',
    w: ['User-plane data on DRBs only', 'Every SRB and every DRB', 'MAC control elements', 'Nothing — LTE PDCP only ciphers'],
    x: 'LTE integrity-protects RRC/NAS signalling on SRBs; DRBs are ciphered but not integrity-protected (NR later added optional user-plane integrity).' });

  Q({ id: 'l2-rohc', t: 'mcq', tp: 'l2', s: 'n4 · 36.323 §5.5',
    q: 'ROHC in PDCP compresses…', a: 'IP/UDP/RTP headers',
    w: ['The application payload', 'MAC subheaders', 'RLC headers', 'The PDCP sequence number'],
    x: 'ROHC removes redundant fields of IP/UDP/RTP (and similar) headers — critical for small VoIP packets where headers dominate.' });

  Q({ id: 'l2-count', t: 'mcq', tp: 'l2', s: 'n4 · 36.323 (COUNT)',
    q: 'The PDCP COUNT used as a ciphering input is built from…', a: 'HFN + PDCP SN',
    w: ['SFN + subframe number', 'RLC SN + segment offset', 'HARQ process ID + NDI', 'C-RNTI + LCID'],
    x: 'COUNT (32 bits) = Hyper Frame Number (MSBs, kept locally) + PDCP SN (LSBs, sent in the header). It must never repeat under the same key.' });

  Q({ id: 'l2-modes', t: 'multi', tp: 'l2', s: 'n9 · 36.322 §4.2.1', n: 5, kmin: 2, kmax: 3,
    v: [
      { q: 'Which statements about RLC <b>UM</b> are true?', a: ['Adds a header with a sequence number', 'Segments and reassembles SDUs', 'Reorders PDUs and detects duplicates', 'Never retransmits lost PDUs'],
        w: ['Sends STATUS PDUs', 'Retransmits NACKed PDUs (ARQ)', 'Has no header at all', 'Re-segments PDUs for retransmission'] },
      { q: 'Which statements about RLC <b>AM</b> are true?', a: ['Retransmits missing PDUs (ARQ)', 'Uses STATUS PDUs with ACK_SN/NACK_SN', 'Can re-segment a PDU for retransmission', 'Detects protocol errors'],
        w: ['Adds no header', 'Is used for BCCH and PCCH', 'Never reorders PDUs', 'Gives up on a PDU after the first NACK'] },
      { q: 'Which statements about RLC <b>TM</b> are true?', a: ['Adds no RLC header', 'Does no segmentation', 'Does no retransmission', 'Carries BCCH, PCCH and CCCH'],
        w: ['Uses sequence numbers', 'Sends STATUS PDUs', 'Is used for DCCH (SRB1/SRB2)', 'Reorders PDUs'] }
    ],

      it.blanks = b.a; it.anyOrder = !!b.anyOrder; if (b.tol != null) it.tol = b.tol;
    } else if (b.t === 'sa') {
      it.parts = b.parts;
    }
    return it;
  }

  /* ---------- Selection ---------- */
  function pickSection(k, n, topics, r) {
    const pool = BANK.filter(it => kindOf(it) === k && topics.includes(it.tp));
    if (!pool.length || n <= 0) return [];
    const groups = new Map();
    for (const it of r.shuf(pool)) { if (!groups.has(it.tp)) groups.set(it.tp, []); groups.get(it.tp).push(it); }
    const keys = r.shuf([...groups.keys()]);
    const out = [];
    // keep "select all that apply" to at most ~35% of the MCQ section
    const multiCap = k === 'mcq' ? Math.max(1, Math.ceil(n * 0.35)) : Infinity;
    let multis = 0, progress = true;
    while (out.length < n && progress) {
      progress = false;
      for (const key of keys) {
        const g = groups.get(key);
        if (!g.length || out.length >= n) continue;
        let j = 0;
        if (multis >= multiCap) { j = g.findIndex(it => it.t !== 'multi'); if (j < 0) continue; }
        const [it] = g.splice(j, 1);
        if (it.t === 'multi') multis++;
        out.push(it); progress = true;
      }
    }
    if (out.length < n) for (const g of groups.values()) while (g.length && out.length < n) out.push(g.shift());
    const gens = pool.filter(it => it.gen || it.v);
    let guard = 0;
    while (out.length < n && gens.length && guard++ < 500) out.push(r.pick(gens));
    return r.shuf(out);
  }
  function buildItems(cfg) {
    const r = Rng(cfg.seed);
    const items = [];
    if (cfg.ids) {
      const pool = BANK.filter(it => cfg.ids.includes(it.id));
      for (const sec of SECTIONS) for (const it of r.shuf(pool.filter(i => kindOf(i) === sec.k))) items.push(instantiate(it, r));
      return items;
    }
    for (const sec of SECTIONS) for (const it of pickSection(sec.k, cfg.counts[sec.k], cfg.topics, r)) items.push(instantiate(it, r));
    return items;
  }

  /* ---------- Test code ---------- */
  const maskOf = topics => TK.reduce((m, k, i) => (topics.includes(k) ? m | (1 << i) : m), 0);
  const topicsOf = mask => TK.filter((k, i) => mask & (1 << i));
  const makeCode = (seed, c, topics) => `${seed.toString(36).toUpperCase()}-${c.sa}-${c.fib}-${c.mcq}-${maskOf(topics).toString(36).toUpperCase()}`;
  function parseCode(code) {
    const m = String(code || '').trim().match(/^([0-9A-Z]+)-(\d{1,2})-(\d{1,2})-(\d{1,3})-([0-9A-Z]+)$/i);
    if (!m) return null;
    const topics = topicsOf(parseInt(m[5], 36));
    if (!topics.length) return null;
    return { seed: parseInt(m[1], 36) >>> 0, counts: { sa: +m[2], fib: +m[3], mcq: +m[4] }, topics };
  }

  /* ---------- Grading ---------- */
  function parseNum(s) {
    if (s == null) return null;
    let t = String(s).trim().replace(/[−–—]/g, '-').replace(/\s+/g, '');
    if (!t) return null;
    if (/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?/.test(t)) t = t.replace(/,/g, ''); else t = t.replace(/,/, '.');
    const m = t.match(/^[+-]?(\d+(\.\d*)?|\.\d+)(e[+-]?\d+)?/i);
    if (!m) return null;
    const rest = t.slice(m[0].length);
    if (rest && !/^[a-zµ%°]*$/i.test(rest)) return null;
    return parseFloat(m[0]);
  }
  const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '');
  function matchOne(input, a, tol) {
    if (input == null || String(input).trim() === '') return false;
    if (/^\s*[+\-−]?\d+(\.\d+)?\s*$/.test(a)) {
      const u = parseNum(input), an = parseNum(a);
      return u != null && Math.abs(u - an) <= (tol == null ? 1e-9 : tol + 1e-9);
    }
    const n = norm(input);
    return n !== '' && n === norm(a);
  }
  const matchAny = (input, acc, tol) => acc.some(a => matchOne(input, a, tol));
  function matchPart(input, p) {
    if (input == null || String(input).trim() === '') return false;
    if (p.t) {
      if (p.exact) { const u = String(input).replace(/\s+/g, '').toLowerCase(); return p.t.some(a => a.toLowerCase() === u); }
      return matchAny(input, p.t);
    }
    const u = parseNum(input);
    return u != null && Math.abs(u - p.n) <= (p.tol == null ? 1e-6 : p.tol + 1e-9);
  }
  function gradeItem(it, A) {
    const v = A.v;
    let ok = false, parts = null;
    if (it.t === 'mcq') ok = v != null && v === it.ans[0];
    else if (it.t === 'multi') { const s = new Set(v || []); ok = s.size === it.ans.length && it.ans.every(i => s.has(i)); }
    else if (it.t === 'fib') {
      const vals = v || [];
      if (it.anyOrder) {
        const used = new Set();
        parts = it.blanks.map((_, i) => { const j = it.blanks.findIndex((acc, ji) => !used.has(ji) && matchAny(vals[i], acc, it.tol)); if (j >= 0) { used.add(j); return true; } return false; });
      } else parts = it.blanks.map((acc, i) => matchAny(vals[i], acc, it.tol));
      ok = parts.every(Boolean);
    } else if (it.t === 'sa') { const vals = v || []; parts = it.parts.map((p, i) => matchPart(vals[i], p)); ok = parts.every(Boolean); }
    if (A.override) ok = true;

  }
  function hasAnswer(it, A) {
    const v = A.v;

  }
  function score(it, A, cbm) {

    const c = A.conf || 1;

  }

  /* ---------- Display helpers ---------- */
  function fmtNum(n, tol) {
    if (Number.isInteger(n)) return String(n);

  }
  const tolTxt = p => (p.tol ? ` <span class="tol">(±${fmtNum(p.tol, p.tol)})</span>` : '');
  function correctHTML(it) {
    if (it.t === 'mcq' || it.t === 'multi') return it.ans.map(i => `<span class="ans-pill">${String.fromCharCode(65 + i)}. ${it.opts[i]}</span>`).join(' ');
    if (it.t === 'fib') return it.blanks.map((acc, i) => `<span class="ans-pill">${it.blanks.length > 1 ? (i + 1) + ': ' : ''}${esc(acc[0])}${acc.length > 1 ? ` <span class="alt">also: ${acc.slice(1).map(esc).join(', ')}</span>` : ''}</span>`).join(' ') + (it.anyOrder ? ' <span class="alt">(any order)</span>' : '');
    return it.parts.map(p => `<span class="ans-pill">${p.l}: <b>${p.t ? esc(p.t[0]) : fmtNum(p.n, p.tol)}</b>${p.u ? ' ' + p.u : ''}${p.t ? '' : tolTxt(p)}</span>`).join(' ');
  }
  function srcHTML(s) {
    const xs = renderSource(s);

    return `<div class="src"><span class="src-label">Sources</span>${xs.map(x => `<span class="srcitem ${x.kind}">${x.text}</span>`).join('')}</div>`;
  }
  const mmss = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(ss).padStart(2, '0'); };
  const pct = (a, b) => (b ? Math.round(a / b * 100) : 0);

  /* ---------- State ---------- */
  const defaultPrefs = { mode: 'exam', preset: 'full', counts: Object.assign({}, PRESETS.full), minutes: suggestMin(PRESETS.full), cbm: true, topics: TK.slice() };
  let prefs = Object.assign({}, defaultPrefs, LS.get(K.prefs, {}));

  let view = 'setup', test = null, timerId = null, reviewFilter = 'all';

  const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(() => { if (test && !test.submitted) LS.set(K.cur, test); }, 250); };
  const savePrefs = () => LS.set(K.prefs, prefs);

  /* ---------- Rendering: shell ---------- */
  const app = () => $('#app');

  }

  }

        <span class="qno">Q${i + 1}</span>
        <span class="chip type ${it.t}">${TYPE_LABEL[it.t]}</span>
        <span class="chip">${TOPICS[it.tp]}</span>
        <span class="spacer"></span>
        <span class="mtimer" id="timer2" aria-hidden="true"></span>
        <button class="flagbtn ${A.flag ? 'on' : ''}" data-act="flag" aria-pressed="${A.flag}" title="Flag for review (F)">⚑ ${A.flag ? 'Flagged' : 'Flag'}</button>
      </div>
      <div class="secline">${sec.name} · ${si} of ${sn} <span class="dim">— ${sec.sub}</span></div>
      ${body}
      ${T.cbm ? confHTML(A, locked) : ''}
      <div id="fb">${A.checked ? feedbackHTML(it, A, T.cbm, i) : ''}</div>
      <div class="qnav">
        <button class="btn ghost" data-act="prev" ${i === 0 ? 'disabled' : ''}>← Previous</button>
        <span class="spacer"></span>
        ${T.mode === 'practice' && !A.checked ? `<button class="btn" data-act="check" ${hasAnswer(it, A) ? '' : 'disabled'}>Check answer</button>` : ''}
        ${i < T.items.length - 1 ? '<button class="btn primary" data-act="next">Next →</button>' : `<button class="btn primary" data-act="submit">${T.mode === 'practice' ? 'Finish' : 'Review &amp; submit'}</button>`}
      </div>
      <div class="kbd-hint dim">Keys: ← → move · 1–${Math.max(4, (it.opts || []).length)} pick options · F flag · Enter next box</div>`;
    if (timerId) tick();
  }

  function optsHTML(it, A, locked, reveal) {
    const multi = it.t === 'multi';
    const sel = multi ? new Set(A.v || []) : new Set(A.v != null ? [A.v] : []);
    return `<div class="opts ${multi ? 'multi' : 'single'}" role="${multi ? 'group' : 'radiogroup'}">${it.opts.map((o, i) => {
      let cls = 'opt';
      if (sel.has(i)) cls += ' sel';
      let mark = '';
      if (reveal) { if (it.ans.includes(i)) { cls += ' correct'; mark = '<span class="mark">✓</span>'; } else if (sel.has(i)) { cls += ' wrong'; mark = '<span class="mark">✗</span>'; } }
      return `<button class="${cls}" data-act="opt" data-i="${i}" ${locked ? 'disabled' : ''} role="${multi ? 'checkbox' : 'radio'}" aria-checked="${sel.has(i)}"><span class="key">${String.fromCharCode(65 + i)}</span><span class="otext">${o}</span>${mark}</button>`;
    }).join('')}</div>${multi ? '<p class="hint">Select all that apply — scored as correct only when your selection matches exactly.</p>' : ''}`;
  }

  function confHTML(A, locked) {
    return `<div class="conf-row"><div class="conf-q">How sure are you?</div><div class="conf" role="radiogroup" aria-label="Confidence">${[1, 2, 3].map(c => `<button data-act="conf" data-c="${c}" class="${A.conf === c ? 'on' : ''}" ${locked ? 'disabled' : ''} role="radio" aria-checked="${A.conf === c}"><b>${CBM[c].label}</b><span>+${CBM[c].ok} / ${CBM[c].bad === 0 ? '0' : '−' + Math.abs(CBM[c].bad)}</span></button>`).join('')}</div></div>`;
  }

  function feedbackHTML(it, A, cbm, i) {
    const r = score(it, A, cbm);
    const canOverride = !r.g.ok && (it.t === 'fib' || it.t === 'sa') && r.answered;
    return `<div class="fb ${r.g.ok ? 'ok' : 'bad'}">
      <div class="fb-head"><b>${r.g.ok ? (A.override ? 'Accepted' : 'Correct') : r.answered ? 'Not quite' : 'Not answered'}</b>${cbm ? ` <span class="pts ${r.pts > 0 ? 'pos' : r.pts < 0 ? 'neg' : ''}">${r.pts > 0 ? '+' : ''}${r.pts} pts</span>${r.conf ? ` <span class="dim">${CBM[r.conf].label} confidence${r.auto ? ' (not set → Low)' : ''}</span>` : ''}` : ''}</div>
      ${!r.g.ok || it.t !== 'mcq' ? `<div class="fb-ans"><span class="dim">Answer</span> ${correctHTML(it)}</div>` : ''}
      <div class="fb-x">${it.x}</div>
      ${srcHTML(it.s)}
      ${canOverride ? `<button class="link" data-act="override" data-i="${i}">My answer means the same thing — count it as correct</button>` : ''}
    </div>`;
  }

  function navCls(i) {
    const T = test, it = T.items[i], A = T.answers[i];
    let c = '';
    if (i === T.cur) c += ' cur';
    if (hasAnswer(it, A)) c += ' ans';
    if (A.flag) c += ' flag';
    if (A.checked || T.submitted) c += gradeItem(it, A).ok ? ' ok' : ' bad';
    return c;
  }
  function updateNav() {
    const T = test;
    const g = $('#navGrid'); if (!g) return;
    g.innerHTML = SECTIONS.map(sec => {
      const idx = []; T.items.forEach((it, i) => { if (kindOf(it) === sec.k) idx.push(i); });
      if (!idx.length) return '';
      return `<div class="nav-sec"><div class="nav-label">${sec.name}</div><div class="nav-grid">${idx.map(i => `<button class="nav-cell${navCls(i)}" data-act="go" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div></div>`;
    }).join('');
    const n = T.items.length, a = T.items.filter((it, i) => hasAnswer(it, T.answers[i])).length;
    $('#progBar').style.width = pct(a, n) + '%';
    $('#progTxt').textContent = `${a} of ${n} answered` + (T.mode === 'practice' ? ` · ${T.answers.filter(x => x.checked).length} checked` : '');
  }

  function startTimer() { stopTimer(); tick(); timerId = setInterval(tick, 500); }
  function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
  function tick() {
    if (!test || test.submitted || view !== 'test') return stopTimer();
    const el = $('#timer'); if (!el) return;
    const now = Date.now();
    const el2 = $('#timer2');
    let txt, cls = '';
    if (test.endAt) {
      const left = test.endAt - now;
      if (left <= 0) { el.textContent = '0:00'; finish(true); return; }
      txt = mmss(left); cls = left < 60000 ? ' crit' : left < 300000 ? ' warn' : '';
    } else txt = mmss(now - test.startedAt);
    el.textContent = txt; el.className = 'timer' + cls;
    if (el2) { el2.textContent = '⏱ ' + txt; el2.className = 'mtimer' + cls; }
  }

  function go(i) { if (i < 0 || i >= test.items.length) return; test.cur = i; renderQ(); updateNav(); tick(); saveSoon(); const f = $('#qpane input:not([disabled])'); if (f && window.matchMedia('(pointer:fine)').matches) f.focus(); const top = $('#qpane').getBoundingClientRect().top; if (top < 64) window.scrollBy({ top: top - 72 }); }

  function pickOpt(i) {
    const it = test.items[test.cur], A = test.answers[test.cur];
    if (test.submitted || A.checked || !it.opts || i >= it.opts.length) return;
    if (it.t === 'multi') { const s = new Set(A.v || []); s.has(i) ? s.delete(i) : s.add(i); A.v = [...s].sort((a, b) => a - b); }
    else A.v = A.v === i ? null : i;
    renderQ(); updateNav(); saveSoon();
  }

  function confirmModal(title, html, okLabel, onOk) {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="modal-box card" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${title}</h3><div>${html}</div><div class="row end"><button class="btn ghost" data-m="no">Keep working</button><button class="btn primary" data-m="ok">${okLabel}</button></div></div>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    m.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (e.target === m || (b && b.dataset.m === 'no')) close(); else if (b && b.dataset.m === 'ok') { close(); onOk(); } });
    $('[data-m="ok"]', m).focus();
  }

  function askSubmit() {
    const T = test;
    const un = T.items.filter((it, i) => !hasAnswer(it, T.answers[i])).length;
    const nc = T.cbm ? T.items.filter((it, i) => hasAnswer(it, T.answers[i]) && !T.answers[i].conf).length : 0;
    const fl = T.answers.filter(a => a.flag).length;
    const notes = [];
    if (un) notes.push(`<b>${un}</b> unanswered (0 points)`);
    if (nc) notes.push(`<b>${nc}</b> without a confidence rating (scored as Low)`);
    if (fl) notes.push(`<b>${fl}</b> flagged for review`);
    confirmModal(T.mode === 'practice' ? 'Finish practice?' : 'Submit test?', notes.length ? `<p>${notes.join('<br>')}</p>` : '<p>All questions answered.</p>', T.mode === 'practice' ? 'Finish' : 'Submit', () => finish(false));
  }

  /* ---------- Finish & results ---------- */
  function summarize(T) {
    const S = { n: T.items.length, correct: 0, pts: 0, max: 0, answered: 0, byType: {}, byTopic: {}, lv: { 1: [0, 0, 0], 2: [0, 0, 0], 3: [0, 0, 0] }, auto: 0 };
    T.items.forEach((it, i) => {
      const r = score(it, T.answers[i], T.cbm);
      if (r.g.ok) S.correct++;
      if (r.answered) S.answered++;
      S.pts += r.pts; S.max += r.max;
      const k = kindOf(it);
      (S.byType[k] = S.byType[k] || [0, 0])[1]++; if (r.g.ok) S.byType[k][0]++;
      (S.byTopic[it.tp] = S.byTopic[it.tp] || [0, 0])[1]++; if (r.g.ok) S.byTopic[it.tp][0]++;
      if (T.cbm && r.conf) { S.lv[r.conf][0]++; if (r.g.ok) S.lv[r.conf][1]++; S.lv[r.conf][2] += r.pts; }
      if (r.auto) S.auto++;
    });
    return S;
  }

  function finish(timeUp) {
    const T = test;
    if (!T || T.submitted) return;
    stopTimer();
    T.submitted = true; T.finishedAt = Date.now(); T.timeUp = !!timeUp;
    const S = summarize(T);
    const missed = LS.get(K.missed, {});
    T.items.forEach((it, i) => { if (gradeItem(it, T.answers[i]).ok) delete missed[it.id]; else missed[it.id] = (missed[it.id] || 0) + 1; });
    LS.set(K.missed, missed);
    const hist = LS.get(K.hist, []);
    hist.unshift({ at: T.finishedAt, code: T.code, label: T.label, mode: T.mode, cbm: T.cbm, n: S.n, correct: S.correct, pts: S.pts, max: S.max, dur: T.finishedAt - T.startedAt, limit: T.minutes, timeUp: T.timeUp, byType: S.byType });
    LS.set(K.hist, hist.slice(0, 60));
    LS.set(K.last, T);
    LS.del(K.cur);
    reviewFilter = 'all';
    view = 'results'; render();
  }

  function renderResults() {
    const T = test, S = summarize(T);
    const dur = (T.finishedAt || Date.now()) - T.startedAt;
    const lvRows = [1, 2, 3].map(c => {
      const [n, ok, p] = S.lv[c], acc = n ? Math.round(ok / n * 100) : null;
      let note = '';
      if (n >= 2) {
        if (c === 3 && acc < 80) note = '<span class="neg">over-confident</span>';
        else if (c === 1 && acc > 67) note = '<span class="warnc">under-confident</span>';
        else if (c === 2 && acc < 67) note = '<span class="neg">over-confident</span>';
        else if (c === 2 && acc > 80) note = '<span class="warnc">could say High</span>';
        else note = '<span class="pos">well calibrated</span>';
      }
      return `<tr><td>${CBM[c].label}</td><td>${n}</td><td>${acc == null ? '—' : acc + '%'}</td><td class="${p > 0 ? 'pos' : p < 0 ? 'neg' : ''}">${p > 0 ? '+' : ''}${p}</td><td>${note}</td></tr>`;
    }).join('');
    const typeRows = SECTIONS.filter(s => S.byType[s.k]).map(s => { const [c, n] = S.byType[s.k]; return `<div class="brow"><span>${s.name}</span><span class="bar"><i style="width:${pct(c, n)}%"></i></span><span class="num">${c}/${n}</span></div>`; }).join('');
    const topicRows = TK.filter(k => S.byTopic[k]).sort((a, b) => pct(...S.byTopic[a]) - pct(...S.byTopic[b])).map(k => { const [c, n] = S.byTopic[k]; return `<div class="brow"><span>${TOPICS[k]}</span><span class="bar"><i style="width:${pct(c, n)}%" class="${pct(c, n) < 50 ? 'low' : ''}"></i></span><span class="num">${c}/${n}</span></div>`; }).join('');
    const counts = { all: T.items.length, wrong: 0, right: 0, flagged: 0 };
    T.items.forEach((it, i) => { const ok = gradeItem(it, T.answers[i]).ok; ok ? counts.right++ : counts.wrong++; if (T.answers[i].flag) counts.flagged++; });

    app().innerHTML = `
    <section class="results">
      <div class="card res-head">
        <div>
          <div class="eyebrow">${T.timeUp ? 'Time is up — auto-submitted' : (T.mode === 'practice' ? 'Practice finished' : 'Test submitted')} · ${T.label ? esc(T.label) : `code <code>${esc(T.code)}</code>`}</div>
          <h1>${S.correct} / ${S.n} correct <span class="dim">· ${pct(S.correct, S.n)}%</span></h1>
        </div>
        <div class="kpis">
          ${T.cbm ? `<div class="kpi"><div class="kv ${S.pts < 0 ? 'neg' : ''}">${S.pts}<small> / ${S.max}</small></div><div class="kl">confidence points · ${pct(Math.max(0, S.pts), S.max)}%</div></div>` : ''}
          <div class="kpi"><div class="kv">${mmss(dur)}</div><div class="kl">time used${T.minutes ? ' of ' + T.minutes + ':00' : ''}</div></div>
          <div class="kpi"><div class="kv">${S.n - S.answered}</div><div class="kl">unanswered</div></div>
        </div>
      </div>
      <div class="cols3">
        ${T.cbm ? `<div class="card"><h3>Calibration</h3><table class="tbl"><thead><tr><th>Rating</th><th>Used</th><th>Right</th><th>Points</th><th></th></tr></thead><tbody>${lvRows}</tbody></table><p class="hint">Aim: Low below 67% right, Medium 67–80%, High above 80%.${S.auto ? ` ${S.auto} answer(s) had no rating and counted as Low.` : ''}</p></div>` : ''}
        <div class="card"><h3>By question type</h3>${typeRows}</div>
        <div class="card"><h3>By topic <span class="dim">weakest first</span></h3>${topicRows}</div>
      </div>
      <div class="card review">
        <div class="review-bar">
          <h2>Review</h2>
          <div class="seg" role="group" aria-label="Filter">
            ${[['all', 'All'], ['wrong', 'Wrong'], ['right', 'Right'], ['flagged', 'Flagged']].map(([k, l]) => `<button data-act="rfilter" data-v="${k}" aria-pressed="${reviewFilter === k}">${l} <span class="dim">${counts[k]}</span></button>`).join('')}
          </div>
        </div>
        <div id="revList">${reviewList()}</div>
      </div>
      <div class="res-actions">
        <button class="btn primary" data-act="again">New test</button>
        ${T.label ? '' : `<button class="btn" data-act="retake" data-code="${esc(T.code)}">Retake same questions</button>`}
        ${counts.wrong ? '<button class="btn" data-act="missed">Practice missed questions</button>' : ''}
        <button class="btn ghost" data-act="print">Print / save PDF</button>
      </div>
    </section>`;
  }

  function reviewList() {
    const T = test;
    const out = [];
    T.items.forEach((it, i) => {
      const A = T.answers[i], r = score(it, A, T.cbm);
      if (reviewFilter === 'wrong' && r.g.ok) return;
      if (reviewFilter === 'right' && !r.g.ok) return;
      if (reviewFilter === 'flagged' && !A.flag) return;
      out.push(reviewItem(it, A, r, i));
    });
    return out.join('') || '<p class="dim">Nothing here.</p>';
  }

  function reviewItem(it, A, r, i) {
    const T = test;
    let body = '';
    if (it.t === 'mcq' || it.t === 'multi') body = `<div class="qtext">${it.q}</div>${optsHTML(it, A, true, true)}`;
    else if (it.t === 'fib') {
      const res = r.g.parts || [];
      body = `<div class="qtext fib">${fibSentence(it, b => { const val = A.v && A.v[b]; const ok = res[b] || A.override; return `<span class="ufill ${ok ? 'ok' : 'bad'}">${val ? esc(val) : '—'}</span>${ok ? '' : `<span class="cfill">${esc(it.blanks[it.anyOrder ? b : b][0])}</span>`}`; })}</div>`;
    } else {
      const res = r.g.parts || [];
      body = `<div class="qtext">${it.q}</div><table class="tbl parts-tbl"><thead><tr><th></th><th>Yours</th><th>Correct</th></tr></thead><tbody>${it.parts.map((p, b) => { const val = A.v && A.v[b]; const ok = res[b] || A.override; return `<tr><td>${p.l}</td><td class="${ok ? 'pos' : 'neg'}">${val ? esc(val) : '—'}</td><td>${p.t ? esc(p.t[0]) : fmtNum(p.n, p.tol) + (p.u ? ' ' + p.u : '') + tolTxt(p)}</td></tr>`; }).join('')}</tbody></table>`;
    }
    const canOverride = !r.g.ok && (it.t === 'fib' || it.t === 'sa') && r.answered;
    return `<article class="rev ${r.g.ok ? 'ok' : 'bad'}">
      <header><span class="qno">Q${i + 1}</span><span class="chip type ${it.t}">${TYPE_LABEL[it.t]}</span><span class="chip">${TOPICS[it.tp]}</span>${A.flag ? '<span class="chip flagchip">⚑ flagged</span>' : ''}<span class="spacer"></span>
      <span class="verdict">${r.g.ok ? (A.override ? 'Accepted' : 'Correct') : r.answered ? 'Wrong' : 'Unanswered'}</span>${T.cbm ? `<span class="pts ${r.pts > 0 ? 'pos' : r.pts < 0 ? 'neg' : ''}">${r.pts > 0 ? '+' : ''}${r.pts}${r.conf ? ` · ${CBM[r.conf].label}${r.auto ? '*' : ''}` : ''}</span>` : ''}</header>
      ${body}
      ${it.t === 'fib' && !r.g.ok ? `<div class="fb-ans"><span class="dim">Accepted</span> ${correctHTML(it)}</div>` : ''}
      <div class="fb-x">${it.x}</div>
      ${srcHTML(it.s)}
      ${canOverride ? `<button class="link" data-act="override" data-i="${i}">My answer means the same thing — count it as correct</button>` : ''}
    </article>`;
  }

  /* ---------- Bank ---------- */
  function bankInstance(item) {
    const salt = bankState.salt[item.id] || 0;
    return instantiate(item, Rng(hash(item.id) + salt * 7919));
  }
  function renderBank() {
    app().innerHTML = `
    <section class="bank">
      <div class="card bank-bar">
        <input type="search" id="bq" placeholder="Search questions, answers, explanations…" value="${esc(bankState.q)}" aria-label="Search">
        <select id="btp" aria-label="Topic"><option value="all">All topics</option>${TK.map(k => `<option value="${k}" ${bankState.tp === k ? 'selected' : ''}>${TOPICS[k]}</option>`).join('')}</select>
        <select id="bty" aria-label="Type"><option value="all">All types</option>${[['sa', 'Short answer'], ['fib', 'Fill in the blank'], ['mcq', 'Single choice'], ['multi', 'Select all that apply']].map(([k, l]) => `<option value="${k}" ${bankState.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <span class="dim" id="bcount"></span>
      </div>
      <div id="bankList"></div>
    </section>`;
    renderBankList();
  }
  function renderBankList() {
    const q = bankState.q.trim().toLowerCase();
    const rows = [];
    let n = 0;
    for (const item of BANK) {
      if (bankState.tp !== 'all' && item.tp !== bankState.tp) continue;
      if (bankState.type !== 'all' && item.t !== bankState.type) continue;
      const it = bankInstance(item);
      if (q) {
        const hay = [it.q, it.x, (it.opts || []).join(' '), JSON.stringify(it.blanks || ''), JSON.stringify(it.parts || ''), TOPICS[it.tp]].join(' ').replace(/<[^>]+>/g, ' ').toLowerCase();
        if (!hay.includes(q)) continue;
      }
      n++;
      if (rows.length < 400) rows.push(bankItem(item, it));
    }
    $('#bankList').innerHTML = rows.join('') || '<p class="dim card">No questions match.</p>';
    $('#bcount').textContent = `${n} template${n === 1 ? '' : 's'}`;
  }
  function bankItem(item, it) {
    let body = '';
    if (it.t === 'mcq' || it.t === 'multi') body = `<div class="qtext">${it.q}</div>${optsHTML(it, { v: it.t === 'multi' ? it.ans : it.ans[0] }, true, true)}`;
    else if (it.t === 'fib') body = `<div class="qtext fib">${fibSentence(it, b => `<span class="ufill ok">${esc(it.blanks[b][0])}</span>`)}</div>${it.blanks.some(a => a.length > 1) ? `<div class="fb-ans"><span class="dim">Accepted</span> ${correctHTML(it)}</div>` : ''}`;
    else body = `<div class="qtext">${it.q}</div><div class="fb-ans"><span class="dim">Answer</span> ${correctHTML(it)}</div>`;
    const tags = [];
    if (item.gen) tags.push('generator — new values each test');
    if (item.v) tags.push(`${item.v.length} variants`);
    if ((it.t === 'mcq' && (item.w || []).length > 3) || it.t === 'multi') tags.push('options sampled from a pool');
    return `<article class="rev bank-item">
      <header><span class="chip type ${it.t}">${TYPE_LABEL[it.t]}</span><span class="chip">${TOPICS[it.tp]}</span><code class="idc">${item.id}</code><span class="spacer"></span>${tags.length ? `<span class="dim small">${tags.join(' · ')}</span>` : ''}${item.gen || item.v || it.t === 'multi' || (item.w || []).length > 3 ? `<button class="link" data-act="regen" data-id="${item.id}" title="Show another variant">↻ another</button>` : ''}</header>
      ${body}
      <div class="fb-x">${it.x}</div>
      ${srcHTML(it.s)}
    </article>`;
  }

  /* ---------- History ---------- */
  function renderHistory() {
    const hist = LS.get(K.hist, []);
    const last = LS.get(K.last, null);
    const missed = Object.keys(LS.get(K.missed, {})).filter(id => BANK.some(b => b.id === id));
    const avg = hist.length ? Math.round(hist.reduce((a, h) => a + pct(h.correct, h.n), 0) / hist.length) : null;
    app().innerHTML = `
    <section class="history">
      <div class="card">
        <div class="review-bar"><h2>History</h2><span class="spacer"></span>
          ${last ? '<button class="btn" data-act="lastreview">Review last test</button>' : ''}
          ${missed.length ? `<button class="btn" data-act="missed">Practice missed (${missed.length})</button>` : ''}
          ${hist.length ? '<button class="btn ghost" data-act="clearhist">Clear history</button>' : ''}
        </div>
        ${hist.length ? `<p class="dim">${hist.length} attempt${hist.length === 1 ? '' : 's'} on this device · average ${avg}% correct. Stored only in this browser.</p>
        <table class="tbl hist-tbl"><thead><tr><th>When</th><th>Mode</th><th>Score</th><th></th><th>Confidence pts</th><th>Time</th><th>Code</th></tr></thead><tbody>
        ${hist.map(h => `<tr><td>${new Date(h.at).toLocaleString()}</td><td>${h.mode}${h.timeUp ? ' <span class="warnc">time up</span>' : ''}</td><td><b>${h.correct}/${h.n}</b> · ${pct(h.correct, h.n)}%</td><td class="hbar"><span class="bar"><i style="width:${pct(h.correct, h.n)}%"></i></span></td><td>${h.cbm ? `${h.pts} / ${h.max}` : '—'}</td><td>${mmss(h.dur)}</td><td>${h.label ? esc(h.label) : `<button class="link mono" data-act="retake" data-code="${esc(h.code)}" title="Retake this exact test">${esc(h.code)}</button>`}</td></tr>`).join('')}
        </tbody></table>` : '<p class="dim">No attempts yet. Results are saved in this browser after you submit a test.</p>'}
      </div>
    </section>`;
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act], [data-view]');
    if (!b || b.disabled) return;
    if (b.dataset.view && !b.dataset.act) {
      if (view === 'test' && test && !test.submitted) saveSoon();
      stopTimer();
      view = b.dataset.view === 'setup' && test && !test.submitted ? 'test' : b.dataset.view;
      render(); return;
    }
    const act = b.dataset.act;
    const T = test;
    switch (act) {
      case 'mode': readSetupForm(); prefs.mode = b.dataset.v; savePrefs(); renderSetup(); break;
      case 'preset': readSetupForm(); prefs.preset = b.dataset.v; if (PRESETS[b.dataset.v]) { const p = PRESETS[b.dataset.v]; prefs.counts = { sa: p.sa, fib: p.fib, mcq: p.mcq }; prefs.minutes = suggestMin(prefs.counts); } savePrefs(); renderSetup(); break;
      case 'suggest': readSetupForm(); prefs.minutes = suggestMin(prefs.counts); savePrefs(); renderSetup(); break;
      case 'topic': { readSetupForm(); const v = b.dataset.v; prefs.topics = prefs.topics.includes(v) ? prefs.topics.filter(x => x !== v) : prefs.topics.concat(v); savePrefs(); renderSetup(); break; }
      case 'topics-all': readSetupForm(); prefs.topics = TK.slice(); savePrefs(); renderSetup(); break;
      case 'topics-none': readSetupForm(); prefs.topics = []; savePrefs(); renderSetup(); break;
      case 'start': startFromSetup(); break;
      case 'resume': test = LS.get(K.cur, null); if (test) { if (test.endAt && test.endAt <= Date.now()) { view = 'test'; render(); finish(true); } else { view = 'test'; render(); } } break;
      case 'discard': LS.del(K.cur); renderSetup(); break;
      case 'missed': {
        const ids = Object.keys(LS.get(K.missed, {})).filter(id => BANK.some(x => x.id === id)).slice(0, 60);
        if (ids.length) startTest({ seed: newSeed(), ids, mode: 'practice', cbm: prefs.cbm, minutes: 0, counts: { sa: 0, fib: 0, mcq: 0 }, topics: TK });
        break;
      }
      case 'retake': { const p = parseCode(b.dataset.code); if (p) startTest(Object.assign(p, { mode: prefs.mode, cbm: prefs.cbm, minutes: prefs.mode === 'exam' ? (prefs.minutes || suggestMin(p.counts)) : 0 })); break; }
      case 'again': view = 'setup'; test = null; render(); break;
      case 'lastreview': test = LS.get(K.last, null); if (test) { view = 'results'; render(); } break;
      case 'clearhist': confirmModal('Clear history?', '<p>This removes all saved attempts and the missed-question list from this browser.</p>', 'Clear', () => { LS.del(K.hist); LS.del(K.missed); LS.del(K.last); renderHistory(); }); break;
      case 'opt': pickOpt(+b.dataset.i); break;
      case 'conf': { const A = T.answers[T.cur]; const c = +b.dataset.c; A.conf = A.conf === c ? null : c; renderQ(); saveSoon(); break; }
      case 'flag': { const A = T.answers[T.cur]; A.flag = !A.flag; renderQ(); updateNav(); saveSoon(); break; }
      case 'prev': go(T.cur - 1); break;
      case 'next': go(T.cur + 1); break;
      case 'go': go(+b.dataset.i); break;
      case 'check': { const A = T.answers[T.cur]; A.checked = true; renderQ(); updateNav(); saveSoon(); break; }
      case 'override': {
        const i = +b.dataset.i; T.answers[i].override = true;
        if (T.submitted) {
          const missed = LS.get(K.missed, {}); delete missed[T.items[i].id]; LS.set(K.missed, missed);
          const hist = LS.get(K.hist, []); const S = summarize(T);
          if (hist[0] && hist[0].at === T.finishedAt) { hist[0].correct = S.correct; hist[0].pts = S.pts; hist[0].byType = S.byType; LS.set(K.hist, hist); }
          LS.set(K.last, T); const y = window.scrollY; renderResults(); window.scrollTo({ top: y });
        } else { renderQ(); updateNav(); saveSoon(); }
        break;
      }
      case 'submit': askSubmit(); break;
      case 'quit': LS.set(K.cur, test); stopTimer(); test = null; view = 'setup'; render(); break;
      case 'copycode': { const code = T ? T.code : ''; try { navigator.clipboard.writeText(code).then(() => { b.textContent = 'copied'; setTimeout(() => (b.textContent = 'copy'), 1200); }, () => {}); } catch (err) { /* ignore */ } break; }
      case 'rfilter': reviewFilter = b.dataset.v; document.querySelectorAll('[data-act="rfilter"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === reviewFilter))); $('#revList').innerHTML = reviewList(); break;
      case 'print': window.print(); break;
      case 'regen': bankState.salt[b.dataset.id] = (bankState.salt[b.dataset.id] || 0) + 1; { const item = BANK.find(x => x.id === b.dataset.id); const art = b.closest('article'); const tmp = document.createElement('div'); tmp.innerHTML = bankItem(item, bankInstance(item)); art.replaceWith(tmp.firstElementChild); } break;
      case 'theme': toggleTheme(); break;
    }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (view === 'test' && test && (t.matches('input.blank') || t.matches('input[data-p]'))) {
      const A = test.answers[test.cur], it = test.items[test.cur];
      const n = it.t === 'fib' ? it.blanks.length : it.parts.length;
      if (!A.v) A.v = new Array(n).fill('');
      const idx = t.matches('input.blank') ? +t.dataset.b : +t.dataset.p;
      A.v[idx] = t.value;
      if (t.matches('input.blank')) t.size = Math.max(7, Math.min(28, t.value.length + 2));
      updateNav(); saveSoon();
      const chk = $('[data-act="check"]'); if (chk) chk.disabled = !hasAnswer(it, A);
    } else if (view === 'bank') {
      if (t.id === 'bq') { bankState.q = t.value; renderBankList(); }
    } else if (view === 'setup' && t.matches('[data-count]')) {
      prefs.preset = 'custom'; readSetupForm();
      document.querySelectorAll('[data-act="preset"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === 'custom')));
      const s = $('[data-act="suggest"]'); if (s) s.textContent = `Suggested: ${suggestMin(prefs.counts)} min`;
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (view === 'bank' && (t.id === 'btp' || t.id === 'bty')) { if (t.id === 'btp') bankState.tp = t.value; else bankState.type = t.value; renderBankList(); }
    if (view === 'setup' && (t.id === 'cbm' || t.id === 'minutes')) readSetupForm();
  });

  document.addEventListener('keydown', e => {
    if (document.querySelector('.modal')) { if (e.key === 'Escape') document.querySelector('.modal').remove(); return; }
    if (view !== 'test' || !test || test.submitted) return;
    const inInput = e.target.matches('input, textarea, select');
    if (inInput) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const ins = [...document.querySelectorAll('#qpane input:not([disabled])')];
        const k = ins.indexOf(e.target);
        if (k >= 0 && k < ins.length - 1) ins[k + 1].focus();
        else if (test.cur < test.items.length - 1) go(test.cur + 1);
      }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { go(test.cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { go(test.cur - 1); e.preventDefault(); }
    else if (/^[1-9]$/.test(e.key)) pickOpt(+e.key - 1);
    else if (e.key === 'f' || e.key === 'F') { const A = test.answers[test.cur]; A.flag = !A.flag; renderQ(); updateNav(); saveSoon(); }
  });

  window.addEventListener('beforeunload', () => { if (test && !test.submitted) LS.set(K.cur, test); });

  /* ---------- Theme ---------- */
  function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next); LS.set(K.theme, next);
  }
  applyTheme(LS.get(K.theme, null));

  /* ---------- Boot ---------- */
  window.__quiz = { BANK, instantiate, Rng, gradeItem, parseCode, buildItems, matchPart, matchAny, parseNum, state: () => test };
  render();
})();

</script>
</body>
</html>
